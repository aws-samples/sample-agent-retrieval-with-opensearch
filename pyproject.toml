[project]
name = "retail-agent-demo"
version = "0.1.0"
description = "Sample: agent retrieval with Amazon OpenSearch Serverless, Amazon Bedrock AgentCore and Amazon OpenSearch Memory"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "requests==2.34.2",
    "boto3==1.44.4",
    "python-dotenv==1.2.3",
    "certifi==2026.10.23",  # pulled in by requests; held at a release that has the fix for PYSEC-2026-4320
]

[project.optional-dependencies]
app = ["streamlit==1.67.0", "pillow==13.0.0"]
data = ["pandas==3.1.1", "pyarrow==26.0.1"]
e2e = ["playwright==1.63.0"]  # the browser checks: also run `playwright install chromium`
dev = ["pytest==9.2.0", "streamlit==1.67.0", "pillow==13.0.0", "pandas==3.1.1", "pyarrow==26.0.1", "cfn-lint==1.61.0", "ruff==0.17.4"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
