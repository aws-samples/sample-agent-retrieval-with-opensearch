name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly: new advisories can appear without a change to the repository

permissions:
  contents: read

jobs:
  tests:
    name: lint and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to commit SHAs (a mutable tag can be repointed); the comment names the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # No network and no AWS account: the unit tests also check the documentation links and the threat-model citations.
      - run: python -m pytest tests/unit -q

  templates:
    name: templates and shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: cfn-lint infra/serverless/*.yaml infra/cloudformation/*.yaml
      - name: cfn_nag
        run: |
          gem install cfn-nag -v 0.8.10 --no-document
          export PATH="$(ruby -e 'puts Gem.user_dir')/bin:$PATH"  # the runner installs gems in the user directory
          for template in infra/serverless/*.yaml infra/cloudformation/*.yaml; do
            cfn_nag_scan --input-path "$template" --fail-on-warnings
          done
      - name: shellcheck
        run: shellcheck infra/ec2/install_app.sh scripts/*.sh
      - name: spelling
        run: |
          pip install codespell==2.4.3
          codespell

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pip-audit==2.10.1
      - name: pip-audit (the app, its tests and its tools)
        run: |
          pip freeze --exclude-editable > /tmp/requirements-dev.txt
          pip-audit -r /tmp/requirements-dev.txt --no-deps --disable-pip
      - name: pip-audit (the packages that run inside AgentCore)
        run: pip-audit -r infra/serverless/agentcore/requirements.txt --no-deps --disable-pip

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
      # The gitleaks binary, not gitleaks-action: the action needs a paid license key on organization repositories.
      - name: gitleaks
        run: |
          v=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${v}"
          curl -fsSL -O "${base}/gitleaks_${v}_linux_x64.tar.gz" -O "${base}/gitleaks_${v}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${v}_checksums.txt"
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
